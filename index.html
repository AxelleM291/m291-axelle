<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axelle — Présentation</title>

    <style>
        /* Mise en page générale */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f2;
            color: #222222;
            line-height: 1.6;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .presentation {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .intro {
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        h2 {
            font-family: Georgia, serif;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        .competences {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .competence {
            border: 1px solid #444444;
            padding: 10px 18px;
            border-radius: 20px;
        }

        a {
            display: inline-block;
            background-color: #222222;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 6px;
        }

        a:hover {
            background-color: #444444;
        }

        /* Adaptation pour les petits écrans */
        @media (max-width: 600px) {
            main {
                padding: 30px 15px;
            }

            .presentation {
                padding: 35px 20px;
            }

            h1 {
                font-size: 2.4rem;
            }

            .intro {
                font-size: 1.05rem;
            }
        }
    </style>
</head>

<!--un troisième commentaire-->

<body>
    <main>
        <section class="presentation">
            <h1>Axelle</h1>

            <p class="intro">Je suis une patate.</p>

            <h2>Mes compétences et envies</h2>

            <div class="competences">
                <span class="competence">Design</span>
                <span class="competence">Gestion de projet</span>
                <span class="competence" style="text-decoration: line-through;">Code</span>
            </div>

            <a href="https://github.com/AxelleM291/m291-axelle" target="_blank">
                Voir mon GitHub
            </a>
        </section>
    </main>
</body>
</html>
